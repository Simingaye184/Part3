<!DOCTYPE html>
<html lang="en-ZA">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Services | Vogue Studio</title>
<style> *{margin:0;padding:0;box-sizing:border-box} body{font-family:Arial;color:#e0e0e0;background:#1a1a1a} nav{background:#141414;padding:1.2rem 5%;display:flex;justify-content:space-between;border-bottom:1px solid #d4af37} nav h2{color:#d4af37} nav div{display:flex;gap:20px;flex-wrap:wrap} nav a{color:#bbb;text-decoration:none;margin-left:20px} nav a.active{color:#d4af37} .container{max-width:1100px;margin:auto;padding:60px 5%;text-align:center} .section-title span{color:#d4af37} .section-title{color:#fff;font-size:2.2rem} .service-tools{display:flex;gap:10px;justify-content:center;margin:20px 0;flex-wrap:wrap} .service-tools input,.service-tools select{padding:10px;background:#222;color:#fff;border:1px solid #555;border-radius:6px} .service-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;text-align:left;margin-top:20px} .service-card{background:#222;border-radius:12px;overflow:hidden;border:1px solid #444;transition:.3s} .service-card:hover{border-color:#d4af37;transform:translateY(-5px)} .service-card img{width:100%;height:350px;object-fit:cover;display:block} .service-card-content{padding:18px} .service-card h3{color:#d4af37;margin-top:8px} .service-card p{color:#bbb;font-size:0.9rem;margin-top:5px} .service-category{color:#d4af37;border:1px solid #806b28;border-radius:15px;padding:2px 8px;font-size:0.7rem} .btn{background:#d4af37;color:#111;padding:10px 22px;border-radius:50px;text-decoration:none;font-weight:bold;display:inline-block;margin-top:12px;font-size:0.9rem} footer{padding:20px;text-align:center;background:#0d0d0d;color:#888;margin-top:30px} @media(max-width:700px){.service-grid{grid-template-columns:1fr}} </style>
</head>
<body><nav><h2>VOGUE STUDIO</h2><div><a href="index.html">Home</a><a href="about.html">About</a><a href="services.html" class="active">Services</a><a href="location.html">Location</a><a href="contact.html">Contact</a></div></nav><section class="container"><h2 class="section-title">Our <span>Services</span></h2><p style="color:#aaa;margin-bottom:10px">3 Services - 3 Real Dresses Made for Our Mbokodos</p><div class="service-tools"><input id="serviceSearch" placeholder="Search dress..."><select id="serviceSort"><option value="default">Default</option><option value="az">A-Z</option></select></div><p id="serviceCount" style="color:#d4af37"></p><div class="service-grid" id="serviceGrid"></div></section><footer>&copy; Vogue Studio | We dress Mbokodos 💜</footer>
<script>
const services=[
{name:"Traditional Wear",category:"African Fashion",description:"Red Shweshwe dress with peplum - Traditional-inspired outfits celebrating identity.",image:"svv.jpeg"},
{name:"Special Occasion Outfits",category:"Occasions",description:"Pink & Orange Ankara Bloom - For celebrations, lobola & special events.",image:"vs.jpeg"},
{name:"Custom Dressmaking",category:"Tailoring",description:"Royal Blue Mbokodo Dress - Personalised dresses around your measurements.",image:"OIP..webp"}
];
const grid=document.getElementById("serviceGrid"),s=document.getElementById("serviceSearch"),so=document.getElementById("serviceSort"),c=document.getElementById("serviceCount");
function render(){
 let t=s.value.toLowerCase();
 let l=services.filter(x=>x.name.toLowerCase().includes(t) || x.category.toLowerCase().includes(t));
 if(so.value=="az")l.sort((a,b)=>a.name.localeCompare(b.name));
 grid.innerHTML=""; 
 l.forEach(a=>{
   grid.innerHTML+=`<div class="service-card"><img src="${a.image}" alt="${a.name}"><div class="service-card-content"><span class="service-category">${a.category}</span><h3>${a.name}</h3><p>${a.description}</p><a href="contact.html" class="btn">Book This Style</a></div></div>`;
 });
 c.textContent=l.length+" service(s) found - with real photos";
}
s.addEventListener("input",render);
so.addEventListener("change",render);
render();
</script></body></html>
